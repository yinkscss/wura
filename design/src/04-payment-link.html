<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Agent — Payment link</title>
<link rel="stylesheet" href="styles.css"/>
</head>

<body class="phone">
  <div class="phone-app">
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <span class="status-icons"><svg width="17" height="12" viewBox="0 0 17 12" fill="none" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx="0.6" fill="currentColor"/>
      <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.6" fill="currentColor"/>
      <rect x="9" y="3" width="3" height="9" rx="0.6" fill="currentColor"/>
      <rect x="13.5" y="0" width="3" height="12" rx="0.6" fill="currentColor" opacity="0.35"/>
    </svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
      <path d="M1.4 4.6A9.5 9.5 0 0 1 8 2.2c2.5 0 4.8.9 6.6 2.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M3.8 6.8A6.2 6.2 0 0 1 8 5.4c1.6 0 3 .5 4.2 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M6.1 8.9A3 3 0 0 1 8 8.3c.7 0 1.4.2 2 .6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="8" cy="11" r="1.1" fill="currentColor"/>
    </svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
      <rect x="0.6" y="0.6" width="21" height="10.8" rx="2.4" stroke="currentColor" stroke-width="1.2"/>
      <rect x="2.3" y="2.3" width="15.2" height="7.4" rx="1.2" fill="currentColor"/>
      <path d="M23.2 4.1v3.8c.9-.4 1.4-1 1.4-1.9s-.5-1.5-1.4-1.9z" fill="currentColor"/>
    </svg></span>
    </div>
    <header class="app-header">
      <div class="left"><span class="icon-btn"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12 4L6 10l6 6" stroke="#08318D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="app-title">Agent</div>
      <div class="right"><span class="bal-chip nums">₦182,450</span></div>
    </header>
    <main class="transcript">
      <div class="day-rule">Today · 12 Nov</div>
      <div class="row user">
        <div class="msg user">Make a payment link for ₦15,000</div>
      </div>
      <div class="row agent">
        <div class="agent-cluster">
          <div class="avatar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 0c.4 4.8 2.4 8.6 7.2 10.2C14.4 11.8 12.4 15.6 12 20.4 11.6 15.6 9.6 11.8 4.8 10.2 9.6 8.6 11.6 4.8 12 0z" fill="#fff"/></svg></div>
          <div class="cluster-body">
            <div class="msg agent">Here’s a payment link for ₦15,000. Anyone with the link can pay you.</div>
            <div class="quote">
              <div class="q-kicker">Payment link · active</div>
              <div class="q-amount nums">₦15,000</div>
              <div class="q-sub">Request · expires in 7 days</div>
              <div class="link-box">
                <span style="opacity:.55"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8.2 11.6l-.8.8a3 3 0 1 1-4.2-4.2l1.6-1.6a3 3 0 0 1 4.2 0M11.8 8.4l.8-.8a3 3 0 1 1 4.2 4.2l-1.6 1.6a3 3 0 0 1-4.2 0" stroke="#08318D" stroke-width="1.6" stroke-linecap="round"/></svg></span>
                <code>example.com/p/8F2K-15K</code>
              </div>
              <div class="q-meta">
                <div><div class="lbl">Status</div><div class="val">Open · not paid yet</div></div>
                <div><div class="lbl">Currency</div><div class="val">NGN</div></div>
              </div>
              <div class="quote-actions">
                <button class="btn btn-outline-blue"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="7" y="7" width="9" height="9" rx="1.8" stroke="#08318D" stroke-width="1.5"/><path d="M5 13V5.8A1.8 1.8 0 0 1 6.8 4H13" stroke="#08318D" stroke-width="1.5" stroke-linecap="round"/></svg> Copy</button>
                <button class="btn btn-pink"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="6" cy="10" r="2.1" stroke="#fff" stroke-width="1.5"/><circle cx="14.2" cy="5.5" r="2.1" stroke="#fff" stroke-width="1.5"/><circle cx="14.2" cy="14.5" r="2.1" stroke="#fff" stroke-width="1.5"/><path d="M7.9 9l4.4-2.6M7.9 11l4.4 2.6" stroke="#fff" stroke-width="1.5"/></svg> Share</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="composer">
      <div class="composer-field">
        <span>Message Agent</span>
        <span class="composer-send"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12M12 6l4 4-4 4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
    </div>
    <div class="home-ind"><i></i></div>
  </div>
</body>
</html>
